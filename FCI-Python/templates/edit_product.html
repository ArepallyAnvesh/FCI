{% extends "base.html" %}
{% block title %}Edit Product - FCI{% endblock %}

{% block content %}
<div class="container">
    <div class="form-wrapper wide">
        <h2>Edit Product</h2>
        <p class="form-subtitle">Update your product details below</p>

        <form method="post" action="{{ url_for('edit_product', product_id=product.product_id) }}" enctype="multipart/form-data">
            <input type="hidden" name="existingImagePath" value="{{ product.image_path or '' }}">

            <div class="form-row">
                <div class="form-group">
                    <label for="productName">Product Name</label>
                    <input type="text" id="productName" name="productName" value="{{ product.product_name }}" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        {% for cat in ['Vegetables', 'Fruits', 'Grains', 'Dairy', 'Spices', 'Other'] %}
                            <option value="{{ cat }}" {{ 'selected' if cat == product.category }}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="price">Price (per unit, in &#8377;)</label>
                    <input type="number" id="price" name="price" min="0" step="0.01" value="{{ product.price }}" required>
                </div>
                <div class="form-group">
                    <label for="quantity">Quantity Available</label>
                    <input type="number" id="quantity" name="quantity" min="0" value="{{ product.quantity }}" required>
                </div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4">{{ product.description or '' }}</textarea>
            </div>

            <div class="form-group">
                <label for="productImage">Replace Product Image (optional)</label>
                <input type="file" id="productImage" name="productImage" accept="image/*">
                {% if product.image_path %}
                    <img id="imagePreview" src="{{ url_for('static', filename=product.image_path) }}" alt="Current image" style="display:block; margin-top:12px; max-height:180px; border-radius:8px;">
                {% else %}
                    <img id="imagePreview" alt="Preview" style="display:none; margin-top:12px; max-height:180px; border-radius:8px;">
                {% endif %}
            </div>

            <button type="submit" class="btn btn-solid btn-full">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
