{% extends "base.html" %}
{% block title %}Register - FCI{% endblock %}

{% block content %}
<div class="container">
    <div class="form-wrapper">
        <h2>Create Your Account</h2>
        <p class="form-subtitle">Register as a farmer to sell, or as a consumer to buy fresh produce</p>

        <div class="role-tabs">
            <a href="{{ url_for('register', role='farmer') }}" class="{{ 'active' if role == 'farmer' }}">I'm a Farmer</a>
            <a href="{{ url_for('register', role='consumer') }}" class="{{ 'active' if role == 'consumer' }}">I'm a Consumer</a>
        </div>

        <form id="registerForm" method="post" action="{{ url_for('register', role=role) }}">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number"
                       pattern="[0-9]{10}" title="Enter a 10-digit mobile number" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" placeholder="Village/City, District, State" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 4 characters" required>
            </div>

            <button type="submit" class="btn btn-solid btn-full">Register as {{ "Farmer" if role == "farmer" else "Consumer" }}</button>
        </form>

        <div class="form-footer-link">
            Already have an account? <a href="{{ url_for('login', role=role) }}">Login here</a>
        </div>
    </div>
</div>
{% endblock %}
